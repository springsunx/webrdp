services:
  # Guacd - Apache Guacamole 守护进程
  guacd:
    image: guacamole/guacd:latest
    container_name: webrdp-guacd
    restart: unless-stopped
    ports:
      - "4822:4822"
    volumes:
      - guacd-data:/var/lib/guacamole
    networks:
      - webrdp-network

  # WebRDP - 合并后的前端+后端+WebSocket服务（兼容 springsunx/webrdp 部署方式）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webrdp-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"    # HTTP + 静态文件 + REST API + WebSocket
    environment:
      - GUACD_HOST=${GUACD_HOST:-guacd}
      - GUACD_PORT=${GUACD_PORT:-4822}
      - PORT=3000
      - PRIMARY_GRACE_SECONDS=${PRIMARY_GRACE_SECONDS:-180}
      - SESSION_IDLE_SECONDS=${SESSION_IDLE_SECONDS:-120}
      - CONNECT_TIMEOUT_SECONDS=${CONNECT_TIMEOUT_SECONDS:-30}
      - MAX_SESSIONS=${MAX_SESSIONS:-50}
      - MAX_PARTICIPANTS=${MAX_PARTICIPANTS:-20}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - guacd
    networks:
      - webrdp-network

volumes:
  guacd-data:

networks:
  webrdp-network:
    driver: bridge
