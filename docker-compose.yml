services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: webrdp-guacd
    restart: unless-stopped
    networks:
      - webrdp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webrdp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GUACD_HOST: guacd
      GUACD_PORT: 4822
      PORT: 3000
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-28800000}
      JOIN_TOKEN_TTL_MS: ${JOIN_TOKEN_TTL_MS:-60000}
      MAX_VIEWERS: ${MAX_VIEWERS:-20}
    depends_on:
      - guacd
    networks:
      - webrdp-network

networks:
  webrdp-network:
    driver: bridge