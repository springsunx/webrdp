<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#181b20">
  <title>WebRDP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 登录界面 -->
  <main class="login-view" id="login-view">
    <div class="login-card">
      <h1 class="login-title" id="login-title">WebRDP</h1>
      <div class="login-error" id="login-error" hidden></div>
      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="host">主机地址 <span class="req">*</span></label>
          <input type="text" id="host" name="host" placeholder="例如: 192.168.1.100 或 rdp.example.com" required>
        </div>

        <div class="field-row">
          <div class="field field-port">
            <label for="port">端口</label>
            <input type="number" id="port" name="port" value="3389" min="1" max="65535">
          </div>
          <div class="field">
            <label for="user">用户名 <span class="req">*</span></label>
            <input type="text" id="user" name="user" placeholder="administrator" required>
          </div>
        </div>

        <div class="field">
          <label for="password">密码 <span class="req">*</span></label>
          <input type="password" id="password" name="password" placeholder="输入密码" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="width">屏幕宽度</label>
            <input type="number" id="width" name="width" value="1024" min="640" max="3840">
          </div>
          <div class="field">
            <label for="height">屏幕高度</label>
            <input type="number" id="height" name="height" value="768" min="480" max="2160">
          </div>
        </div>

        <details class="advanced-box">
          <summary>更多选项（域 / 显示名称）</summary>
          <div class="field-row">
            <div class="field">
              <label for="domain">域 (可选)</label>
              <input type="text" id="domain" name="domain" placeholder="WORKGROUP">
            </div>
            <div class="field">
              <label for="display-name">我的昵称 (可选)</label>
              <input type="text" id="display-name" name="displayName" placeholder="如: 手机端" maxlength="24">
            </div>
          </div>
        </details>

        <label class="checkbox-row">
          <input type="checkbox" id="remember" checked>
          <span>记住连接信息</span>
        </label>

        <button type="submit" class="primary-btn" id="connect-btn">连接</button>
      </form>
    </div>
  </main>

  <!-- 远程桌面界面 -->
  <div class="desktop-view" id="desktop-view" hidden>
    <!-- 紧凑单行顶栏 -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <span class="status-dot" id="status-dot" data-status="disconnected" title="未连接"></span>
        <span class="topbar-title" id="desktop-title">WebRDP</span>
        <span class="duration" id="session-duration" title="真实会话连接时长">--:--</span>
        <button type="button" class="pill-btn roster-btn" id="roster-btn" title="在线成员">
          <span class="icon">👥</span><span id="roster-count">1</span>
        </button>
      </div>

      <div class="topbar-right">
        <span class="ctl-badge" id="control-badge" hidden>主控</span>
        <button type="button" class="ctl-btn" id="control-btn" hidden>接管</button>
        <button type="button" class="icon-btn" id="kb-btn" title="键盘 (三指轻点亦可切换)" aria-label="键盘">⌨</button>
        <button type="button" class="icon-btn" id="more-btn" title="更多操作" aria-label="更多操作">⋯</button>
      </div>
    </header>

    <!-- 在线成员浮层 -->
    <div class="popover roster-popover" id="roster-popover" hidden>
      <div class="popover-title">共享会话成员</div>
      <ul class="roster-list" id="roster-list"></ul>
      <div class="roster-meta" id="roster-meta" hidden></div>
    </div>

    <!-- 远程画面主舞台 -->
    <div class="stage" id="stage" tabindex="0">
      <div class="canvas-host" id="canvas-host"></div>

      <!-- 非阻塞状态横幅（重连/网络抖动/已断开） -->
      <div class="status-banner" id="status-banner" hidden>
        <span id="banner-text"></span>
        <button type="button" class="banner-btn" id="banner-btn" hidden>立即重连</button>
      </div>

      <!-- 首次连接或不可恢复错误遮罩 -->
      <div class="stage-overlay" id="stage-overlay" hidden>
        <div class="spinner" id="overlay-spinner"></div>
        <p class="overlay-text" id="overlay-text">正在连接...</p>
        <div class="overlay-actions" id="overlay-actions" hidden>
          <button type="button" class="btn btn-primary" id="overlay-retry">重试</button>
          <button type="button" class="btn btn-ghost" id="overlay-back">返回修改</button>
        </div>
      </div>

      <!-- 轻提示 -->
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <!-- 移动端/快捷扩展键栏（随键盘呼出显示） -->
    <div class="kb-bar" id="kb-bar" hidden>
      <button type="button" data-key="Escape">Esc</button>
      <button type="button" data-key="Tab">Tab</button>
      <button type="button" data-key="Control" data-sticky="1">Ctrl</button>
      <button type="button" data-key="Alt" data-sticky="1">Alt</button>
      <button type="button" data-key="Meta" data-sticky="1">Win</button>
      <button type="button" data-key="Delete">Del</button>
      <button type="button" data-action="rclick">右键</button>
      <button type="button" data-key="ArrowLeft">←</button>
      <button type="button" data-key="ArrowUp">↑</button>
      <button type="button" data-key="ArrowDown">↓</button>
      <button type="button" data-key="ArrowRight">→</button>
      <button type="button" data-action="cad">C+A+D</button>
      <button type="button" class="kb-close" data-action="close">收起</button>
    </div>

    <!-- 隐藏输入代理（用于移动端软键盘与中文输入法） -->
    <textarea id="ime-input" class="ime-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true"></textarea>

    <!-- 更多功能抽屉 -->
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
    <aside class="drawer" id="more-drawer" hidden>
      <div class="drawer-section">
        <div class="drawer-label">连接目标</div>
        <div class="drawer-info" id="info-target">-</div>
      </div>

      <div class="drawer-section">
        <div class="drawer-label">触屏操作模式</div>
        <div class="seg-group">
          <button type="button" class="seg-btn" id="mode-touchpad">触控板</button>
          <button type="button" class="seg-btn" id="mode-touch">直接触控</button>
        </div>
        <label class="toggle-row">
          <input type="checkbox" id="scroll-lock">
          <span>双指滑动优先滚轮（而非拖动画布）</span>
        </label>
        <div class="drawer-hint">单指点击/拖拽 · 双指轻点或长按右键 · 双指捏合缩放 · 三指轻点键盘</div>
      </div>

      <div class="drawer-section">
        <div class="drawer-label">画面缩放</div>
        <div class="seg-group">
          <button type="button" class="seg-btn" id="zoom-fit">适应全屏</button>
          <button type="button" class="seg-btn" id="zoom-height">适应高度</button>
          <button type="button" class="seg-btn" id="zoom-100">1:1</button>
        </div>
      </div>

      <div class="drawer-section">
        <div class="drawer-label">远程分辨率</div>
        <div class="res-row">
          <input type="number" id="res-width" min="640" max="3840" value="1024">
          <span>×</span>
          <input type="number" id="res-height" min="480" max="2160" value="768">
          <button type="button" class="btn btn-primary btn-sm" id="res-apply">应用</button>
        </div>
      </div>

      <div class="drawer-section drawer-actions">
        <button type="button" class="btn btn-ghost" id="btn-paste">粘贴本地剪贴板</button>
        <button type="button" class="btn btn-ghost" id="btn-cad">发送 Ctrl+Alt+Del</button>
        <button type="button" class="btn btn-ghost" id="btn-fullscreen">全屏切换</button>
        <button type="button" class="btn btn-ghost" id="btn-reconnect">重新连接</button>
        <button type="button" class="btn btn-danger" id="btn-disconnect">断开连接</button>
        <button type="button" class="btn btn-ghost" id="btn-back">返回登录页</button>
      </div>
    </aside>
  </div>

  <script src="guacamole-common-js/dist/guacamole-common.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
